name: Independent review gate

# 메타데이터만 조회하며 PR 코드·워크플로우·의존성을 실행하지 않는다.
# 기본 브랜치의 승인된 게이트 코드만 읽기 위해 target을 사용한다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: review-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted gate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate current PR state without calling AI
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { runGate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-gate.mjs`);
            await runGate({ github, context, core });
