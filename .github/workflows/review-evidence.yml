name: Collect review evidence

# 정보 기록 전용. AI 실행·관리자 확인·승인·병합을 하지 않는다.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: CLI가 전달하는 PR 번호 (request의 대상과 일치해야 함)
        required: true
        type: string
      request:
        description: CLI가 계산한 리뷰 등록 요청 JSON (관리자 확인 아님)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  issues: write

concurrency:
  group: review-evidence-${{ github.repository }}-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read approved code from the default branch execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect and record evidence with the workflow token
        id: publish
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { publishEvidence } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-evidence.mjs`);
            try {
              const request = JSON.parse(context.payload.inputs.request);
              const publisherContext = { repo: context.repo, eventName: context.eventName, ref: context.ref, sha: context.sha, runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), requestedNumber: context.payload.inputs.pr_number };
              const result = await publishEvidence({ github, context: publisherContext, request });
              if (result.receiptName) {
                const { writeFileSync } = await import('node:fs');
                const { join } = await import('node:path');
                writeFileSync(join(process.env.RUNNER_TEMP, 'review-evidence-receipt.json'), JSON.stringify({ commentId: result.commentId, commentUrl: result.commentUrl, evidenceHash: result.evidenceHash }), { encoding: 'utf8', flag: 'wx' });
                core.setOutput('receipt-name', result.receiptName);
              }
              core.summary.addHeading('리뷰 자료 기록 — 관리자 확인 아님');
              core.summary.addRaw(`보고서 댓글 ID: ${result.commentId}\n\n보고서 SHA-256: ${result.evidenceHash}\n\n중복 재사용: ${result.reused}\n`);
              await core.summary.write();
            } catch {
              core.setFailed('자료 등록 실패. 입력·전체 조회·최신성·실행 출처·기존 댓글을 확인하세요. 자동 재시도·승인하지 않습니다.');
            }
      # 영수증 이름 자체에 댓글 ID·본문 hash를 연결한다. 로컬 리뷰 실행의 인증서는 아니다.
      - name: Record publication receipt
        if: steps.publish.outputs.receipt-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.publish.outputs.receipt-name }}
          path: ${{ runner.temp }}/review-evidence-receipt.json
          if-no-files-found: error
          retention-days: 90
