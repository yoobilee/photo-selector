name: Collect review evidence

# 정보 기록 전용. AI 실행·관리자 확인·승인·병합을 하지 않는다.
on:
  workflow_dispatch:
    inputs:
      request:
        description: CLI가 계산한 리뷰 등록 요청 JSON (관리자 확인 아님)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: write

concurrency:
  group: review-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read approved code from the default branch execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect and record evidence with the workflow token
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { publishEvidence } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-evidence.mjs`);
            try {
              const request = JSON.parse(context.payload.inputs.request);
              const publisherContext = { repo: context.repo, eventName: context.eventName, ref: context.ref, sha: context.sha, runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) };
              const result = await publishEvidence({ github, context: publisherContext, request });
              core.summary.addHeading('리뷰 자료 기록 — 관리자 확인 아님');
              core.summary.addRaw(`보고서 댓글 ID: ${result.commentId}\n\n보고서 SHA-256: ${result.evidenceHash}\n\n중복 재사용: ${result.reused}\n`);
              await core.summary.write();
            } catch {
              core.setFailed('자료 등록 실패. 입력·전체 조회·최신성·실행 출처·기존 댓글을 확인하세요. 자동 재시도·승인하지 않습니다.');
            }
